<!DOCTYPE>
<html>

<head>
  <title>VueJS Course</title>
  <link rel="stylesheet" type="text/css" href="main.css" />
</head>

<body>
  <div id="app">
    <label>
      <input type="checkbox" v-model="isPurple"/> Purple
    </label>

    <!-- binding classes -->
    <!-- <div class="circle" :class=" { purple: isPurple } ">
      Hi!
    </div> -->

    <!-- we can uses computed & multiple class binding -->
    <div class="circle" :class=[textColour,binding_classes] :style="[
    { width: size + 'px', height: size + 'px', lineHeight: size + 'px' },
    { transform: rotating }
    ]">
      Hi!
    </div>

    <br>
    <select v-model="textColour">
      <option value="">White</option>
      <option value="text-black">Black</option>
      <option value="text-orange">Orange</option>
    </select>

    <label>
      Size:
      <input type="number" v-model="size"/>
    </label>
    
    <label>
      Rotate:
      <input type="number" v-model="rotateText"/>
    </label>
  </div>

  <script src="https://unpkg.com/vue@next"></script>
  <script src="app.js"></script>
</body>

</html>
